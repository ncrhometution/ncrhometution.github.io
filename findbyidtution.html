<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Find Tuition | NCR Home Tuition</title>
  <link rel="icon" type="image/png" href="favicon.svg">
  <link rel="shortcut icon" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .find-page { padding: 60px 0; background: var(--bg); min-height: calc(100vh - 64px); }
    .find-card {
      max-width: 480px;
      margin: 0 auto;
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: 48px 40px;
      text-align: center;
    }
    .find-card .icon-circle {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--accent), #fbbf24);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 20px;
      box-shadow: 0 6px 20px rgba(245,158,11,0.3);
    }
    .search-header {
      background: var(--bg-white);
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-modern">
  <div class="container">
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <a href="index.html" class="navbar-brand">
      <span class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></span>
      NCR Home Tuition
    </a>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="how-it-works.html">How It Works</a></li>
        <li class="nav-item"><a class="nav-link" href="student-register.html">I Need a Tutor</a></li>
        <li class="nav-item"><a class="nav-link" href="tutor-register.html">Join as Tutor</a></li>
        <li class="nav-item"><a class="nav-link" href="findbyidtutor.html">Find Tutor</a></li>
        <li class="nav-item"><a class="nav-link active" href="findbyidtution.html">Find Tuition</a></li>
      </ul>
    </div>
      <div class="auth-actions" id="authButtons">
        <a href="login.html" class="btn-nav-login">Login</a>
        <a href="student-register.html" class="btn-nav-signup">Sign Up Free</a>
      </div>
  </div>
</nav>

<div class="search-header">
  <div class="container d-flex align-items-center gap-3">
    <select class="form-select" id="typeSelect" style="max-width:150px;height:40px;border-radius:var(--radius-md);font-size:13px">
      <option value="tutor">Find Teacher</option>
      <option value="student">Find Students</option>
    </select>
    <input type="text" id="queryInput" class="form-control" placeholder="Search by course or subject..." style="height:40px;border-radius:var(--radius-md);font-size:13px">
    <button class="btn btn-accent-custom btn-sm" onclick="doSearch()" style="height:40px;padding:0 18px">
      <i class="fa-solid fa-search"></i>
    </button>
  </div>
</div>

<section class="find-page">
  <div class="find-card animate-in">
    <div class="icon-circle"><i class="fa-solid fa-book-open"></i></div>
    <h4 style="font-weight:800;margin-bottom:4px">Find Tuition by ID</h4>
    <p style="color:var(--text-muted);font-size:14px;margin-bottom:24px">Enter the tuition/post ID to view full details</p>

    <div style="position:relative;max-width:320px;margin:0 auto">
      <input type="text" id="profileId" class="form-control" placeholder="Enter Tuition ID" style="height:48px;border-radius:var(--radius-md);font-size:14px;text-align:center">
      <div id="errorTip" style="display:none;position:absolute;top:-28px;left:50%;transform:translateX(-50%);background:var(--danger);color:#fff;padding:4px 12px;border-radius:var(--radius-sm);font-size:12px;white-space:nowrap">
        * This field is required
      </div>
    </div>

    <button class="btn btn-accent-custom mt-4" onclick="validateProfile()" style="width:100%;justify-content:center;height:48px">
      <i class="fa-solid fa-magnifying-glass"></i> View Details
    </button>
  </div>
</section>

<footer class="footer" style="margin-top:auto">
  <div class="container">
    <div class="footer-bottom">&copy; 2026 NCR Home Tuition. All rights reserved.</div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/auth.js"></script>
<script>try{initFirebase();}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
renderAuthButtons("authButtons");
function doSearch() {
  var q = document.getElementById("queryInput").value.trim();
  var type = document.getElementById("typeSelect") ? document.getElementById("typeSelect").value : "tutor";
  var params = new URLSearchParams();
  if (q) params.append("q", q);
  params.append("type", type);
  window.location.href = "search.html?" + params.toString();
}
function validateProfile() {
  var input = document.getElementById("profileId");
  var error = document.getElementById("errorTip");
  if (input.value.trim() === "") {
    error.style.display = "block";
    input.focus();
    return;
  }
  error.style.display = "none";
  window.location.href = "data.html?id=" + input.value.trim() + "&type=student";
}
</script>
</body>
</html>
