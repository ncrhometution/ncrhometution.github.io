<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile | NCR Home Tuition</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/qRjkLrqS/Whats-App-Image-2026-02-02-at-07-28-40-removebg-preview.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .profile-page{padding:100px 0 60px;min-height:100vh;background:linear-gradient(135deg,#f8faff 0%,#f0e6ff 100%)}
    .profile-card{max-width:700px;margin:0 auto;background:var(--bg-white);border-radius:var(--radius-xl);padding:40px;box-shadow:var(--shadow-lg)}
    .profile-hero{text-align:center;margin-bottom:32px}
    .profile-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#2979ff);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;margin-bottom:16px;box-shadow:0 4px 20px rgba(26,115,232,0.3)}
    .profile-hero h2{font-weight:800;font-size:24px;margin-bottom:4px}
    .profile-hero p{color:var(--text-muted);font-size:14px}
    .profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px}
    .stat-box{text-align:center;padding:20px;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--bg)}
    .stat-box .stat-icon{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:8px}
    .stat-box .stat-icon.blue{background:var(--primary-light);color:var(--primary)}
    .stat-box .stat-icon.orange{background:#fff3e0;color:var(--accent)}
    .stat-box .stat-icon.green{background:#e8f5e9;color:var(--success)}
    .stat-box .stat-value{font-size:24px;font-weight:800}
    .stat-box .stat-label{font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
    .info-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
    .info-row:last-child{border-bottom:none}
    .info-row .info-icon{width:36px;height:36px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-muted)}
    .info-row .info-label{font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
    .info-row .info-value{font-size:15px;font-weight:600}
    .quick-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:24px}
    .qa-btn{display:flex;align-items:center;gap:10px;padding:14px 18px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--bg-white);text-decoration:none;color:var(--text-primary);font-weight:600;font-size:14px;transition:var(--transition)}
    .qa-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow-md)}
    .qa-btn i{font-size:16px}
    .btn-logout{width:100%;margin-top:20px;padding:12px;border-radius:var(--radius-md);border:2px solid var(--danger);background:transparent;color:var(--danger);font-weight:700;font-size:14px;cursor:pointer;transition:var(--transition)}
    .btn-logout:hover{background:var(--danger);color:#fff}
    @media(max-width:576px){.profile-stats{grid-template-columns:1fr}.quick-actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="profile-page">
    <div class="container">
      <div class="profile-card animate-in" id="profileCard">
        <div class="profile-hero">
          <div class="profile-avatar" id="avatar">U</div>
          <h2 id="userName">Guest</h2>
          <p id="userEmail">Not logged in</p>
        </div>
        <div class="profile-stats" id="profileStats">
          <div class="stat-box">
            <div class="stat-icon blue"><i class="fa-solid fa-bolt"></i></div>
            <div class="stat-value" id="statLeads">0</div>
            <div class="stat-label">Leads</div>
          </div>
          <div class="stat-box">
            <div class="stat-icon orange"><i class="fa-solid fa-shopping-cart"></i></div>
            <div class="stat-value" id="statCart">0</div>
            <div class="stat-label">In Cart</div>
          </div>
          <div class="stat-box">
            <div class="stat-icon green"><i class="fa-solid fa-shield"></i></div>
            <div class="stat-value" id="statRole">-</div>
            <div class="stat-label">Role</div>
          </div>
        </div>
        <h3 style="font-weight:700;font-size:16px;margin-bottom:12px"><i class="fa-solid fa-user"></i> Personal Info</h3>
        <div id="infoSection">
          <div class="info-row"><div class="info-icon"><i class="fa-solid fa-user"></i></div><div><div class="info-label">Name</div><div class="info-value" id="infoName">-</div></div></div>
          <div class="info-row"><div class="info-icon"><i class="fa-solid fa-envelope"></i></div><div><div class="info-label">Email</div><div class="info-value" id="infoEmail">-</div></div></div>
          <div class="info-row"><div class="info-icon"><i class="fa-solid fa-phone"></i></div><div><div class="info-label">Mobile</div><div class="info-value" id="infoMobile">-</div></div></div>
        </div>
        <div class="quick-actions">
          <a href="cart.html" class="qa-btn"><i class="fa-solid fa-shopping-cart" style="color:var(--accent)"></i> Buy Leads</a>
          <a href="student-register.html" class="qa-btn"><i class="fa-solid fa-graduation-cap" style="color:var(--primary)"></i> Find Tutor</a>
          <a href="tutor-register.html" class="qa-btn"><i class="fa-solid fa-chalkboard-user" style="color:var(--success)"></i> Join as Tutor</a>
          <a href="search.html" class="qa-btn"><i class="fa-solid fa-magnifying-glass" style="color:#7c3aed"></i> Search</a>
        </div>
        <button class="btn-logout" onclick="logoutUser()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
      </div>
    </div>
  </div>

  <footer class="footer"><div class="container"><div class="footer-bottom">&copy; 2026 NCR Home Tuition. All rights reserved.</div></div></footer>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/auth.js"></script>
  <script>
    firebase.initializeApp(FIREBASE_CONFIG);
    document.getElementById('navbar-placeholder').innerHTML = getNavHTML('');
    renderAuthButtons('authButtons');

    if (!isLoggedIn()) {
      window.location.href = 'login.html';
    } else {
      var profile = getProfile();
      var initial = (profile.displayName || profile.email || 'U').charAt(0).toUpperCase();
      document.getElementById('avatar').textContent = initial;
      document.getElementById('userName').textContent = profile.displayName || 'User';
      document.getElementById('userEmail').textContent = profile.email || '';
      document.getElementById('statLeads').textContent = getLeads();
      document.getElementById('statCart').textContent = getCartItemCount();
      document.getElementById('statRole').textContent = profile.role ? profile.role.charAt(0).toUpperCase() + profile.role.slice(1) : '-';
      document.getElementById('infoName').textContent = profile.displayName || '-';
      document.getElementById('infoEmail').textContent = profile.email || '-';
      document.getElementById('infoMobile').textContent = profile.mobile_no || '-';
    }
  </script>
</body>
</html>
