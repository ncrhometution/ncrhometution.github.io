<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verify Payment | NCR Home Tuition</title>
  <link rel="icon" type="image/png" href="favicon.svg">
  <link rel="shortcut icon" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .verify-page{padding:60px 0;background:var(--bg);min-height:calc(100vh - 64px)}
    .verify-card{max-width:560px;margin:0 auto;background:var(--bg-white);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);padding:40px;text-align:center}
    .verify-card .icon-circle{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--primary),#14b8a6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 20px;box-shadow:0 6px 20px rgba(15,118,110,0.3)}
    .verify-card h4{font-weight:800;margin-bottom:4px}
    .verify-card .sub{color:var(--text-muted);font-size:14px;margin-bottom:24px}
    .method-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
    .method-tab{padding:8px 16px;border-radius:var(--radius-full);border:1.5px solid var(--border);background:var(--bg-white);font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:var(--transition)}
    .method-tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
    .method-tab:hover:not(.active){border-color:var(--primary);color:var(--primary)}
    .verify-input{height:48px;border-radius:var(--radius-md);font-size:14px;border:1.5px solid var(--border);text-align:center}
    .verify-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(15,118,110,0.12)}
    .result-box{margin-top:24px;border-radius:var(--radius-lg);padding:20px;text-align:left;display:none}
    .result-box.success{background:#e8f5e9;border:1.5px solid #a5d6a7}
    .result-box.fail{background:#ffebee;border:1.5px solid #ef9a9a}
    .result-box .rb-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px dashed rgba(0,0,0,0.08)}
    .result-box .rb-row:last-child{border:none}
    .result-box .rb-row .rb-label{color:var(--text-muted);font-weight:600}
    .result-box .rb-row .rb-value{font-weight:700;color:var(--text-primary);word-break:break-all;text-align:right;max-width:60%}
  </style>
</head>
<body>

<div id="navbar-placeholder"></div>

<section class="verify-page">
  <div class="verify-card animate-in">
    <div class="icon-circle"><i class="fa-solid fa-circle-check"></i></div>
    <h4>Verify Payment</h4>
    <p class="sub">Check the status of your payment using any of the IDs below</p>

    <div class="method-tabs">
      <button class="method-tab active" data-method="razorpay" onclick="setMethod('razorpay')">Razorpay Payment ID</button>
      <button class="method-tab" data-method="order" onclick="setMethod('order')">Order ID</button>
      <button class="method-tab" data-method="internal" onclick="setMethod('internal')">Internal ID</button>
    </div>

    <input type="text" id="verifyInput" class="form-control verify-input" placeholder="e.g. pay_xxxxxxxxxxxxxx">
    <div id="verifyError" style="color:var(--danger);font-size:12px;margin-top:8px;display:none"></div>

    <button class="btn btn-primary-custom mt-3" onclick="verifyNow()" style="width:100%;justify-content:center;height:48px">
      <i class="fa-solid fa-magnifying-glass"></i> Check Status
    </button>

    <div class="result-box" id="resultBox"></div>
  </div>
</section>

<footer class="footer"><div class="container"><div class="footer-bottom">&copy; 2026 NCR Home Tuition. All rights reserved.</div></div></footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
initFirebase();
document.getElementById('navbar-placeholder').innerHTML = getNavHTML('');
renderAuthButtons('authButtons');

var currentMethod = "razorpay";

function setMethod(m) {
  currentMethod = m;
  document.querySelectorAll(".method-tab").forEach(function(t) {
    t.classList.toggle("active", t.getAttribute("data-method") === m);
  });
  var ph = m === "razorpay" ? "e.g. pay_xxxxxxxxxxxxxx" :
           m === "order" ? "e.g. order_xxxxxxxxxxxxxx" :
           "e.g. local payment UUID";
  document.getElementById("verifyInput").placeholder = ph;
  document.getElementById("resultBox").style.display = "none";
  document.getElementById("verifyError").style.display = "none";
}

function verifyNow() {
  var val = document.getElementById("verifyInput").value.trim();
  var errEl = document.getElementById("verifyError");
  var box = document.getElementById("resultBox");
  if (!val) {
    errEl.textContent = "Please enter an ID";
    errEl.style.display = "block";
    return;
  }
  errEl.style.display = "none";
  box.style.display = "none";

  Swal.fire({ title: "Checking...", allowOutsideClick: false, didOpen: function() { Swal.showLoading(); } });

  var req;
  if (currentMethod === "razorpay") req = getPaymentByRazorpay(val);
  else if (currentMethod === "order") req = getPaymentByOrder(val);
  else req = api(APIS.paymentById(val));

  req.then(function(data) {
    Swal.close();
    var p = data.payment || data;
    if (!p || !p.id) throw new Error("No payment record found");
    var ok = (p.status || "").toLowerCase() === "paid";
    box.className = "result-box " + (ok ? "success" : "fail");
    box.style.display = "block";
    var amt = (p.amount || 0) / 100;
    box.innerHTML =
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">' +
        '<i class="fa-solid ' + (ok ? "fa-circle-check" : "fa-circle-info") + '" style="font-size:28px;color:' + (ok ? "var(--success)" : "var(--accent)") + '"></i>' +
        '<div><div style="font-weight:800;font-size:16px">' + (ok ? "Payment Successful" : "Payment " + (p.status || "Pending")) + '</div>' +
        '<div style="font-size:12px;color:var(--text-muted)">' + (ok ? "Your leads have been credited" : "This payment has not been completed") + '</div></div>' +
      '</div>' +
      '<div class="rb-row"><span class="rb-label">Amount</span><span class="rb-value">₹' + amt.toLocaleString("en-IN") + '</span></div>' +
      '<div class="rb-row"><span class="rb-label">Status</span><span class="rb-value">' + (p.status || "-") + '</span></div>' +
      '<div class="rb-row"><span class="rb-label">Type</span><span class="rb-value">' + (p.user_type || "-") + '</span></div>' +
      '<div class="rb-row"><span class="rb-label">Email</span><span class="rb-value">' + (p.email || "-") + '</span></div>' +
      '<div class="rb-row"><span class="rb-label">Mobile</span><span class="rb-value">' + (p.mobile_no || "-") + '</span></div>' +
      '<div class="rb-row"><span class="rb-label">Order ID</span><span class="rb-value">' + (p.razorpay_order_id || "-") + '</span></div>' +
      '<div class="rb-row"><span class="rb-label">Payment ID</span><span class="rb-value">' + (p.razorpay_payment_id || "-") + '</span></div>' +
      '<div class="rb-row"><span class="rb-label">Paid At</span><span class="rb-value">' + (p.paid_at ? new Date(p.paid_at).toLocaleString("en-IN") : "-") + '</span></div>';
  }).catch(function(err) {
    Swal.close();
    box.className = "result-box fail";
    box.style.display = "block";
    box.innerHTML = '<div style="display:flex;align-items:center;gap:10px">' +
      '<i class="fa-solid fa-triangle-exclamation" style="font-size:28px;color:var(--danger)"></i>' +
      '<div><div style="font-weight:800;font-size:15px">Not Found</div>' +
      '<div style="font-size:12px;color:var(--text-muted)">' + getErrorMessage(err) + '</div></div></div>';
  });
}
</script>
</body>
</html>
