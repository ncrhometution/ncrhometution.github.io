<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | NCR Home Tuition</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/qRjkLrqS/Whats-App-Image-2026-02-02-at-07-28-40-removebg-preview.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f8faff 0%,#e8f0fe 50%,#f0e6ff 100%);padding:40px 20px;position:relative;overflow:hidden}
    .auth-page::before{content:'';position:absolute;top:-200px;right:-200px;width:500px;height:500px;background:radial-gradient(circle,rgba(26,115,232,0.08) 0%,transparent 70%);border-radius:50%}
    .auth-card{width:100%;max-width:460px;background:var(--bg-white);border-radius:var(--radius-xl);padding:40px;box-shadow:var(--shadow-xl);position:relative;z-index:2}
    .auth-card .logo-circle{width:56px;height:56px;background:linear-gradient(135deg,var(--accent),#ff9800);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:24px;margin-bottom:16px;box-shadow:0 4px 14px rgba(255,109,0,0.3)}
    .auth-card h3{text-align:center;font-weight:800;font-size:24px;margin-bottom:4px}
    .auth-card .subtitle{text-align:center;color:var(--text-muted);font-size:14px;margin-bottom:28px}
    .btn-google{width:100%;height:50px;background:var(--bg-white);border:1.5px solid var(--border);border-radius:var(--radius-md);font-weight:600;font-size:14px;color:var(--text-primary);display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:var(--transition)}
    .btn-google:hover{background:#f8f9fa;border-color:#bbb}
    .divider-line{display:flex;align-items:center;margin:20px 0;gap:12px}
    .divider-line::before,.divider-line::after{content:'';flex:1;height:1px;background:var(--border)}
    .divider-line span{font-size:13px;color:var(--text-muted);font-weight:500}
    .input-group-modern{position:relative;margin-bottom:14px}
    .input-group-modern .input-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:16px;z-index:5}
    .input-group-modern .form-control{padding-left:44px;height:50px;border:1.5px solid var(--border);border-radius:var(--radius-md);font-size:14px;transition:var(--transition)}
    .input-group-modern .form-control:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,115,232,0.12)}
    .btn-submit{width:100%;height:50px;background:linear-gradient(135deg,var(--primary),#2979ff);color:#fff;border:none;border-radius:var(--radius-md);font-weight:700;font-size:15px;transition:var(--transition);box-shadow:0 2px 10px rgba(26,115,232,0.3);cursor:pointer}
    .btn-submit:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(26,115,232,0.4);color:#fff}
    .error-text{color:var(--danger);font-size:12px;margin-top:-8px;margin-bottom:10px;display:none}
    .admin-toggle{margin-top:20px;text-align:center}
    .admin-toggle a{font-size:13px;color:var(--text-muted);text-decoration:none;font-weight:500}
    .admin-toggle a:hover{color:var(--primary)}
    .admin-form{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
  </style>
</head>
<body>

<div class="auth-page">
  <div class="auth-card animate-in">
    <div style="text-align:center;margin-bottom:8px">
      <div class="logo-circle"><i class="fa-solid fa-graduation-cap"></i></div>
    </div>
    <h3>Welcome Back</h3>
    <p class="subtitle">Login to your NCR Home Tuition account</p>

    <button class="btn-google" onclick="loginWithGoogle()">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Login with Google
    </button>

    <div class="divider-line"><span>or login with email</span></div>

    <div class="input-group-modern">
      <i class="fa-solid fa-envelope input-icon"></i>
      <input type="email" id="loginEmail" class="form-control" placeholder="Email Address">
    </div>
    <div id="loginEmailError" class="error-text">Please enter your email</div>

    <div class="input-group-modern">
      <i class="fa-solid fa-lock input-icon"></i>
      <input type="password" id="loginPass" class="form-control" placeholder="Password">
    </div>
    <div id="loginPassError" class="error-text">Please enter your password</div>

    <div id="loginAuthError" class="error-text" style="text-align:center;margin-top:8px"></div>

    <button class="btn-submit" onclick="loginWithEmail()">
      <i class="fa-solid fa-arrow-right-to-bracket"></i>&nbsp; Login
    </button>

    <p style="text-align:center;margin-top:20px;font-size:13px;color:var(--text-muted)">
      Don't have an account? <a href="signup.html" style="font-weight:600">Sign Up Free</a>
    </p>

    <div class="admin-toggle">
      <a href="#" onclick="toggleAdmin()">Are you an Admin?</a>
    </div>
    <div class="admin-form" id="adminForm">
      <div class="input-group-modern">
        <i class="fa-solid fa-key input-icon"></i>
        <input type="password" id="adminToken" class="form-control" placeholder="Admin Secret Key">
      </div>
      <button class="btn-submit" onclick="adminLogin()" style="height:44px;font-size:13px;background:linear-gradient(135deg,var(--accent),#ff9800)">
        <i class="fa-solid fa-shield-halved"></i>&nbsp; Admin Login
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/auth.js"></script>
<script>
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const googleProvider = new firebase.auth.GoogleAuthProvider();
if (isLoggedIn()) window.location.href = "profile.html";

function loginWithGoogle() {
  Swal.fire({ title: "Connecting to Google...", allowOutsideClick: false, didOpen: () => Swal.showLoading() });
  auth.signInWithPopup(googleProvider).then(function(result) {
    Swal.close();
    var u = result.user;
    var profile = { uid: u.uid, displayName: u.displayName, email: u.email, mobile_no: u.phoneNumber || "", role: "", emailVerified: u.emailVerified, leads: 0 };
    saveProfile(profile);
    loadCartFromFirestore().then(function() {
      syncProfileToFirestore();
      Swal.fire({ icon: "success", title: "Welcome, " + (u.displayName || "there") + "!", timer: 1200, showConfirmButton: false }).then(function() { window.location.href = "index.html"; });
    });
  }).catch(function(err) {
    Swal.close();
    if (err.code === "auth/popup-closed-by-user") return;
    if (err.code === "auth/account-exists-with-different-credential") {
      Swal.fire({ icon: "warning", title: "Account Exists", text: "This email is registered with email/password. Please login with email instead.", confirmButtonColor: "#ff6d00" });
      return;
    }
    showLoginError(err.message);
  });
}

function loginWithEmail() {
  var email = document.getElementById("loginEmail").value.trim();
  var pass = document.getElementById("loginPass").value;
  if (!email) { showField("loginEmailError"); return; } else hideField("loginEmailError");
  if (!pass) { showField("loginPassError"); return; } else hideField("loginPassError");

  Swal.fire({ title: "Logging in...", allowOutsideClick: false, didOpen: function() { Swal.showLoading(); } });
  auth.signInWithEmailAndPassword(email, pass).then(function(result) {
    var u = result.user;
    if (!u.emailVerified) {
      Swal.fire({
        icon: "warning", title: "Email Not Verified",
        text: "Please verify your email first. Check your inbox.",
        confirmButtonColor: "#ff6d00",
        showDenyButton: true, denyButtonText: "Resend", confirmButtonText: "OK"
      }).then(function(r) {
        if (r.isDenied) { u.sendEmailVerification(); Swal.fire("Verification email sent!", "", "success"); }
      });
      return;
    }
    var profile = { uid: u.uid, displayName: u.displayName || "", email: u.email, mobile_no: "", role: "", emailVerified: true, leads: 0 };
    saveProfile(profile);
    loadCartFromFirestore().then(function() {
      syncProfileToFirestore();
      Swal.fire({ icon: "success", title: "Welcome back!", timer: 1200, showConfirmButton: false }).then(function() { window.location.href = "index.html"; });
    });
  }).catch(function(err) {
    Swal.close();
    var msg = err.message;
    if (err.code === "auth/user-not-found") msg = "No account found with this email. Please sign up first.";
    if (err.code === "auth/wrong-password") msg = "Incorrect password. Please try again.";
    showLoginError(msg);
  });
}

function adminLogin() {
  var token = document.getElementById("adminToken").value.trim();
  if (!token) return;
  Swal.fire({ title: "Verifying...", allowOutsideClick: false, didOpen: function() { Swal.showLoading(); } });
  fetch("https://ncrhomr.vercel.app/admin/login", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ token: token })
  }).then(function(r) { return r.json(); }).then(function(data) {
    Swal.close();
    if (data.status === "success" || data.token) {
      localStorage.setItem("admin_token", data.token || token);
      Swal.fire({ icon: "success", title: "Admin Access Granted", timer: 1500, showConfirmButton: false }).then(function() { window.location.href = "admin.html"; });
    } else {
      showLoginError("Invalid admin key");
    }
  }).catch(function() { Swal.close(); showLoginError("Connection error. Try again."); });
}

function toggleAdmin() {
  var f = document.getElementById("adminForm");
  f.style.display = f.style.display === "none" ? "block" : "none";
}
function showLoginError(msg) { var el = document.getElementById("loginAuthError"); el.textContent = msg; el.style.display = "block"; }
function showField(id) { document.getElementById(id).style.display = "block"; }
function hideField(id) { document.getElementById(id).style.display = "none"; }
</script>
</body>
</html>
