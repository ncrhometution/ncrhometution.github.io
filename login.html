<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | NCR Home Tuition</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/qRjkLrqS/Whats-App-Image-2026-02-02-at-07-28-40-removebg-preview.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f8faff 0%, #e8f0fe 50%, #f0e6ff 100%);
      position: relative;
      overflow: hidden;
    }
    .login-page::before {
      content: '';
      position: absolute;
      top: -200px;
      right: -200px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(26,115,232,0.08) 0%, transparent 70%);
      border-radius: 50%;
    }
    .login-page::after {
      content: '';
      position: absolute;
      bottom: -150px;
      left: -150px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(255,109,0,0.06) 0%, transparent 70%);
      border-radius: 50%;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      padding: 40px;
      box-shadow: var(--shadow-xl);
      position: relative;
      z-index: 2;
    }
    .login-card .brand-logo { text-align: center; margin-bottom: 8px; }
    .login-card .logo-circle {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--accent), #ff9800);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 24px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(255,109,0,0.3);
    }
    .login-card h3 { text-align: center; font-weight: 800; font-size: 24px; margin-bottom: 4px; }
    .login-card .subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }

    .btn-google {
      width: 100%; height: 50px;
      background: var(--bg-white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      font-weight: 600; font-size: 14px;
      color: var(--text-primary);
      display: flex; align-items: center; justify-content: center; gap: 10px;
      cursor: pointer; transition: var(--transition);
    }
    .btn-google:hover { background: #f8f9fa; border-color: #bbb; }

    .divider-line {
      display: flex; align-items: center; margin: 20px 0; gap: 12px;
    }
    .divider-line::before, .divider-line::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .divider-line span { font-size: 13px; color: var(--text-muted); font-weight: 500; }

    .input-group-modern { position: relative; margin-bottom: 14px; }
    .input-group-modern .input-icon {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 16px; z-index: 5;
    }
    .input-group-modern .form-control {
      padding-left: 44px; height: 50px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 14px; transition: var(--transition);
    }
    .input-group-modern .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26,115,232,0.12);
    }
    .btn-login-main {
      width: 100%; height: 50px;
      background: linear-gradient(135deg, var(--primary), #2979ff);
      color: #fff; border: none;
      border-radius: var(--radius-md);
      font-weight: 700; font-size: 15px;
      transition: var(--transition);
      box-shadow: 0 2px 10px rgba(26,115,232,0.3);
      cursor: pointer;
    }
    .btn-login-main:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(26,115,232,0.4); color: #fff; }
    .error-text { color: var(--danger); font-size: 12px; margin-top: -8px; margin-bottom: 10px; display: none; text-align: center; }

    .register-option {
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: var(--transition);
      cursor: pointer;
      text-decoration: none;
    }
    .register-option:hover { border-color: var(--primary); background: var(--primary-light); transform: translateX(4px); }
    .register-option .opt-icon {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .register-option .opt-icon.blue { background: var(--primary-light); color: var(--primary); }
    .register-option .opt-icon.orange { background: var(--accent-light); color: var(--accent); }
    .register-option h6 { margin: 0; font-weight: 700; font-size: 13px; color: var(--text-primary); }
    .register-option p { margin: 0; font-size: 11px; color: var(--text-muted); }
  </style>
</head>
<body>

<div class="login-page">
  <div class="login-card animate-in">
    <div class="brand-logo">
      <div class="logo-circle"><i class="fa-solid fa-graduation-cap"></i></div>
    </div>
    <h3>Welcome Back</h3>
    <p class="subtitle">Login to your NCR Home Tuition account</p>

    <!-- Google Login -->
    <button class="btn-google" onclick="loginWithGoogle()">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>

    <div class="divider-line"><span>or login with email</span></div>

    <!-- Email / Password -->
    <div class="input-group-modern">
      <i class="fa-solid fa-envelope input-icon"></i>
      <input type="email" id="loginEmail" class="form-control" placeholder="Email Address">
    </div>
    <div class="input-group-modern">
      <i class="fa-solid fa-lock input-icon"></i>
      <input type="password" id="loginPass" class="form-control" placeholder="Password">
    </div>
    <div id="loginError" class="error-text"></div>

    <button class="btn-login-main" onclick="loginWithEmail()">
      <i class="fa-solid fa-right-to-bracket"></i>&nbsp; Login
    </button>

    <div class="d-flex justify-content-between align-items-center mt-3" style="font-size:13px">
      <label style="display:flex;align-items:center;gap:6px;color:var(--text-secondary);cursor:pointer">
        <input type="checkbox" style="accent-color:var(--primary)"> Remember me
      </label>
      <a href="#" style="font-size:13px">Forgot password?</a>
    </div>

    <!-- Admin login (legacy) -->
    <div style="margin-top:16px;text-align:center">
      <button onclick="toggleAdmin()" style="background:none;border:none;color:var(--text-muted);font-size:12px;cursor:pointer;text-decoration:underline">
        <i class="fa-solid fa-lock"></i> Admin Login
      </button>
      <div id="adminSection" style="display:none;margin-top:12px">
        <div class="input-group-modern">
          <i class="fa-solid fa-user-shield input-icon"></i>
          <input type="text" id="adminUser" class="form-control" placeholder="Admin Username">
        </div>
        <div class="input-group-modern">
          <i class="fa-solid fa-key input-icon"></i>
          <input type="password" id="adminPass" class="form-control" placeholder="Admin Password">
        </div>
        <button class="btn-login-main" style="height:42px;font-size:13px" onclick="loginAdmin()">Admin Login</button>
      </div>
    </div>

    <div class="divider-line"><span>New here?</span></div>

    <a href="signup.html" class="register-option">
      <div class="opt-icon blue"><i class="fa-solid fa-user-plus"></i></div>
      <div>
        <h6>Create Free Account</h6>
        <p>Sign up as student or tutor in 30 seconds</p>
      </div>
      <i class="fa-solid fa-chevron-right" style="margin-left:auto;color:var(--text-muted);font-size:12px"></i>
    </a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="js/auth.js"></script>

<script>
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const provider = new firebase.auth.GoogleAuthProvider();

if (isLoggedIn()) { window.location.href = "profile.html"; }

function showErr(msg) { const el = document.getElementById("loginError"); el.textContent = msg; el.style.display = "block"; }
function hideErr() { document.getElementById("loginError").style.display = "none"; }

// Google Login
function loginWithGoogle() {
  Swal.fire({ title: "Signing in...", allowOutsideClick: false, didOpen: () => Swal.showLoading() });
  auth.signInWithPopup(provider)
    .then(result => {
      Swal.close();
      const user = result.user;
      // Check if profile exists
      let profile = getProfile();
      if (!profile || profile.uid !== user.uid) {
        // New user - save basic profile, they need to complete it
        profile = {
          uid: user.uid,
          displayName: user.displayName || "",
          email: user.email || "",
          mobile_no: "",
          role: "",
          createdAt: new Date().toISOString(),
          leads: 0
        };
        saveProfile(profile);
        localStorage.setItem("user_leads", "0");
      }
      window.location.href = "index.html";
    })
    .catch(err => {
      Swal.close();
      if (err.code === "auth/popup-closed-by-user") return;
      showErr(err.message);
    });
}

// Email Login
function loginWithEmail() {
  const email = document.getElementById("loginEmail").value.trim();
  const pass = document.getElementById("loginPass").value;
  hideErr();
  if (!email || !pass) { showErr("Email and password are required"); return; }

  Swal.fire({ title: "Logging in...", allowOutsideClick: false, didOpen: () => Swal.showLoading() });

  auth.signInWithEmailAndPassword(email, pass)
    .then(result => {
      Swal.close();
      const user = result.user;
      let profile = getProfile();
      if (!profile || profile.uid !== user.uid) {
        profile = {
          uid: user.uid,
          displayName: user.displayName || "",
          email: user.email || "",
          mobile_no: "",
          role: "",
          createdAt: new Date().toISOString(),
          leads: 0
        };
        saveProfile(profile);
        localStorage.setItem("user_leads", "0");
      }
      Swal.fire({ icon: "success", title: "Welcome back!", text: "Login successful", timer: 1000, showConfirmButton: false });
      setTimeout(() => { window.location.href = "index.html"; }, 1000);
    })
    .catch(err => {
      Swal.close();
      let msg = "Invalid email or password";
      if (err.code === "auth/user-not-found") msg = "No account found with this email. Please sign up first.";
      if (err.code === "auth/wrong-password") msg = "Incorrect password. Please try again.";
      showErr(msg);
    });
}

// Admin Login (legacy)
function toggleAdmin() {
  const sec = document.getElementById("adminSection");
  sec.style.display = sec.style.display === "none" ? "block" : "none";
}

function loginAdmin() {
  const username = document.getElementById("adminUser").value.trim();
  const password = document.getElementById("adminPass").value.trim();
  if (!username || !password) { showErr("Admin credentials required"); return; }

  Swal.fire({ title: "Logging in...", allowOutsideClick: false, didOpen: () => Swal.showLoading() });

  fetch("https://ncrhomr.vercel.app/admin/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password })
  })
  .then(r => r.json())
  .then(data => {
    Swal.close();
    if (data.session_token) {
      localStorage.setItem("admin_token", data.session_token);
      // Also create a profile for admin
      saveProfile({
        uid: "admin",
        displayName: "Admin",
        email: username,
        mobile_no: "",
        role: "admin",
        createdAt: new Date().toISOString(),
        leads: 999
      });
      localStorage.setItem("user_leads", "999");
      Swal.fire({ icon: "success", title: "Admin Login Successful!", timer: 1000, showConfirmButton: false });
      setTimeout(() => { window.location.href = "index.html"; }, 1000);
    } else {
      showErr("Invalid admin credentials");
    }
  })
  .catch(() => { Swal.close(); showErr("Server error. Please try again."); });
}

// Enter key to login
document.addEventListener("keydown", (e) => { if (e.key === "Enter") loginWithEmail(); });
</script>
</body>
</html>
